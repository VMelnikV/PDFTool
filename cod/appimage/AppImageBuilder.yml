version: 1

script:
  - rm -rf AppDir | true
  - mkdir -p AppDir/usr/bin
  - mkdir -p AppDir/usr/share/applications
  - mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
  - mkdir -p AppDir/usr/share/ghostscript
  
  # Копіюємо один файл (з --onefile)
  - cp dist/PDFTool AppDir/usr/bin/PDFTool
  - chmod +x AppDir/usr/bin/PDFTool
  
  # Копіюємо іконку
  - cp pdf_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/pdf-tool.png 2>/dev/null || true
  
  # КОПІЮЄМО БІНАРНИЙ ФАЙЛ GHOSTSCRIPT
  - cp /usr/bin/gs AppDir/usr/bin/gs
  - chmod +x AppDir/usr/bin/gs
  
  # КОПІЮЄМО ВСІ РЕСУРСИ GHOSTSCRIPT
  - cp -r /usr/share/ghostscript/10.02.1 AppDir/usr/share/ghostscript/
  
  # Копіюємо шрифти
  - mkdir -p AppDir/usr/share/fonts/type1
  - cp -r /usr/share/ghostscript/fonts AppDir/usr/share/ghostscript/ 2>/dev/null || true
  - cp -r /usr/share/fonts/type1/gsfonts AppDir/usr/share/fonts/type1/ 2>/dev/null || true
  
  # Створюємо .desktop файл
  - echo "[Desktop Entry]" > AppDir/usr/share/applications/pdf-tool.desktop
  - echo "Name=PDFTool" >> AppDir/usr/share/applications/pdf-tool.desktop
  - echo "Comment=Universal PDF Editor" >> AppDir/usr/share/applications/pdf-tool.desktop
  - echo "Exec=PDFTool" >> AppDir/usr/share/applications/pdf-tool.desktop
  - echo "Icon=pdf-tool" >> AppDir/usr/share/applications/pdf-tool.desktop
  - echo "Terminal=false" >> AppDir/usr/share/applications/pdf-tool.desktop
  - echo "Type=Application" >> AppDir/usr/share/applications/pdf-tool.desktop
  - echo "Categories=Office;Graphics;" >> AppDir/usr/share/applications/pdf-tool.desktop

AppDir:
  path: ./AppDir
  app_info:
    id: com.example.pdf-tool
    name: PDFTool
    icon: pdf-tool
    version: 1.0.0
    exec: usr/bin/PDFTool
    exec_args: $@

  # ВИДАЛЯЄМО apt СЕКЦІЮ (щоб уникнути помилок)

  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc
      - usr/lib/systemd
      - usr/lib/kernel
      - usr/lib/llvm-13
      - usr/lib/udev
      - usr/share/bug
      - usr/share/bash-completion
      - usr/share/lintian
      - usr/share/X11
      - usr/sbin
      - etc/init.d
      - etc/security
      - etc/systemd
      - etc/dbus-1
      - etc/avahi
      - etc/X11

  runtime:
    env:
      PATH: '$APPDIR/usr/bin/:/usr/bin/'
      LD_LIBRARY_PATH: '$APPDIR/usr/lib/x86_64-linux-gnu/:$LD_LIBRARY_PATH'
      XDG_DATA_DIRS: '$APPDIR/usr/share:/usr/share'
      GS_LIB: '$APPDIR/usr/share/ghostscript/10.02.1/Resource/Init'
      GS_FONTPATH: '$APPDIR/usr/share/ghostscript/fonts'
