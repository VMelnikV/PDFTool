name: Build AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ghostscript libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxkbcommon-x11-0 libgl1-mesa-glx libegl1
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow pypdf PyPDFForm PySide6 pyinstaller appimage-builder
    
    - name: Build Light AppImage
      run: |
        # Використовуємо файли з cod_l
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        
        # Копіюємо код з cod_l
        cp -r cod_l/* AppDir/usr/bin/
        chmod +x AppDir/usr/bin/launcher.py
        
        # Створюємо обгортку для запуску
        cat > AppDir/usr/bin/PDFTool << 'EOF'
        #!/bin/bash
        SCRIPT_DIR=$(dirname "$0")
        PYTHON_CMD=$(which python3 || which python)
        if [ -z "$PYTHON_CMD" ]; then
            echo "Помилка: Python не знайдено"
            exit 1
        fi
        exec "$PYTHON_CMD" "$SCRIPT_DIR/launcher.py" "$@"
        EOF
        chmod +x AppDir/usr/bin/PDFTool
        
        # Створюємо .desktop файл
        cat > AppDir/usr/share/applications/pdf-tool.desktop << 'EOF'
        [Desktop Entry]
        Name=PDFTool
        Comment=Universal PDF Editor
        Exec=PDFTool
        Icon=pdf-tool
        Terminal=true
        Type=Application
        Categories=Office;Graphics;
        EOF
        
        # Копіюємо іконку (якщо є)
        cp pdf_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/pdf-tool.png 2>/dev/null || true
    
    - name: Create Light AppImage
      run: |
        # Завантажуємо appimagetool
        wget -c "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
        chmod +x appimagetool-x86_64.AppImage
        
        # Створюємо AppImage
        ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir PDFTool-Light.AppImage
    
    - name: Upload Light AppImage
      uses: actions/upload-artifact@v3
      with:
        name: PDFTool-Light
        path: PDFTool-Light.AppImage
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          PDFTool-Light.AppImage
        generate_release_notes: true
