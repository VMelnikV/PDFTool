name: Build DEB Package

on:
  push:
    tags:
      - 'PDFTool_deb_*'     # Автоматичний запуск для тегів типу PDFTool_deb_1.0, PDFTool_deb_1.1 тощо
  workflow_dispatch:        # Можливість запустити вручну з інтерфейсу GitHub

# Надаємо права на запис для завантаження файлів у реліз
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper build-essential

      - name: Build DEB package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: List generated files (for debugging)
        run: ls -la ../*.deb

      - name: Upload DEB to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ../*.deb
          draft: false
          prerelease: false
