name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils ghostscript xvfb \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-cursor0 libfontconfig1 libfreetype6

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install pytest pytest-qt

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Integration tests (headless)
        run: xvfb-run -a pytest tests/integration -v
