# .gitlab-ci.yml
# CI/CD для PDF Tool - автоматична збірка deb та AppImage

stages:
  - build
  - package
  - deploy

variables:
  GIT_DEPTH: 1
  DEBIAN_FRONTEND: noninteractive

# ============================================
# ЗБІРКА DEB-ПАКЕТА
# ============================================

build:deb:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq wget git file sudo python3 python3-pip python3-venv ghostscript poppler-utils
    - pip install PySide6 PyPDFForm pypdf Pillow pdf2image
  script:
    - echo "Збірка DEB пакета..."
    - mkdir -p packages/deb/
    - ./scripts/build-deb.sh
  artifacts:
    paths:
      - packages/deb/pdf-tool*.deb
    expire_in: 1 week
  only:
    - main
    - tags

# ============================================
# ЗБІРКА APPIMAGE
# ============================================

build:appimage:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq wget file git python3 python3-pip python3-venv
    - pip install pyinstaller appimage-builder
    - pip install PySide6 PyPDFForm pypdf Pillow
    - export PATH="$HOME/.local/bin:$PATH"
    - wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool-x86_64.AppImage
    - chmod +x appimagetool-x86_64.AppImage
  script:
    - echo "Збірка AppImage..."
    - mkdir -p packages/appimage/
    - ./scripts/build-appimage.sh
  artifacts:
    paths:
      - packages/appimage/PDFTool*.AppImage
    expire_in: 1 week
  only:
    - tags

# ============================================
# СТВОРЕННЯ APT-РЕПОЗИТОРІЮ
# ============================================

create-apt-repo:
  stage: package
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq dpkg-dev
  script:
    - echo "Створення APT репозиторію..."
    - mkdir -p public/apt/
    - cp packages/deb/*.deb public/apt/
    - cd public/apt/
    - dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
    - echo "APT репозиторій створено!"
  artifacts:
    paths:
      - public/
    expire_in: 1 month
  only:
    - tags

# ============================================
# ПУБЛІКАЦІЯ НА GITLAB PAGES
# ============================================

pages:
  stage: deploy
  image: ubuntu:22.04
  script:
    - echo "Публікація APT репозиторію на GitLab Pages..."
    - if [ -d "public" ]; then echo "Репозиторій готовий до публікації"; fi
  artifacts:
    paths:
      - public/
    expire_in: 1 year
  only:
    - tags

# ============================================
# РЕЛІЗ НА GITLAB
# ============================================

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Створення релізу..."
  release:
    name: "PDF Tool $CI_COMMIT_TAG"
    description: |
      ## PDF Tool $CI_COMMIT_TAG

      ### 📦 DEB пакет
      - [PDF Tool](https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/deb/pdf-tool_$CI_COMMIT_TAG-1_all.deb?job=build:deb)

      ### 🪶 AppImage
      - [PDF Tool AppImage](https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/appimage/PDFTool-$CI_COMMIT_TAG.AppImage?job=build:appimage)

      ### 📦 APT репозиторій
      Додайте наш репозиторій:
      ```bash
      echo "deb https://melnikv.gitlab.io/pdf_tool/apt stable main" | sudo tee /etc/apt/sources.list.d/pdf-tool.list
      sudo apt update
      sudo apt install pdf-tool
tag_name: $CI_COMMIT_TAG
assets:
links:

    name: "PDF Tool DEB"
    url: "https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/deb/pdf-tool_$CI_COMMIT_TAG-1_all.deb?job=build:deb"

    name: "PDF Tool AppImage"
    url: "https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/appimage/PDFTool-$CI_COMMIT_TAG.AppImage?job=build:appimage"
    only:

    tags
