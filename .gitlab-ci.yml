# .gitlab-ci.yml
# CI/CD для PDF Tool - автоматична збірка deb та AppImage

stages:
  - build
  - package
  - deploy

variables:
  GIT_DEPTH: 1
  DEBIAN_FRONTEND: noninteractive

# Загальний шаблон для збірки DEB
.build_template: &build_template
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq wget git file sudo python3 python3-pip python3-venv ghostscript poppler-utils
    - pip install PySide6 PyPDFForm pypdf Pillow pdf2image
  artifacts:
    paths:
      - packages/

# ============================================
# ЗБІРКА DEB-ПАКЕТІВ
# ============================================

build:deb-full:
  stage: build
  <<: *build_template
  script:
    - echo "Збірка DEB пакета (FULL версія)..."
    - mkdir -p packages/deb/
    - ./scripts/build-deb-full.sh
  artifacts:
    paths:
      - packages/deb/pdf-tool-full*.deb
    expire_in: 1 week
  only:
    - main
    - tags

build:deb-light:
  stage: build
  <<: *build_template
  script:
    - echo "Збірка DEB пакета (LIGHT версія)..."
    - mkdir -p packages/deb/
    - ./scripts/build-deb-light.sh
  artifacts:
    paths:
      - packages/deb/pdf-tool-light*.deb
    expire_in: 1 week
  only:
    - main
    - tags

# ============================================
# ЗБІРКА APPIMAGE
# ============================================

build:appimage-full:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq wget file git python3 python3-pip python3-venv
    - wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool-x86_64.AppImage
    - chmod +x appimagetool-x86_64.AppImage
  script:
    - echo "Збірка AppImage (FULL версія)..."
    - mkdir -p packages/appimage/
    - ./scripts/build-appimage.sh full
  artifacts:
    paths:
      - packages/appimage/PDFTool-Full*.AppImage
    expire_in: 1 week
  only:
    - tags

build:appimage-light:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq wget file git python3 python3-pip python3-venv
    # Завантаження appimagetool з офіційного дзеркала
    - wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool-x86_64.AppImage
    - chmod +x appimagetool-x86_64.AppImage
  script:
    - echo "Збірка AppImage (LIGHT версія)..."
    - mkdir -p packages/appimage/
    - ./scripts/build-appimage.sh light
  artifacts:
    paths:
      - packages/appimage/PDFTool-Light*.AppImage
    expire_in: 1 week
  only:
    - tags

# ============================================
# СТВОРЕННЯ APT-РЕПОЗИТОРІЮ
# ============================================

create-apt-repo:
  stage: package
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq dpkg-dev
  script:
    - echo "Створення APT репозиторію..."
    - mkdir -p public/apt/
    - cp packages/deb/*.deb public/apt/
    - cd public/apt/
    - dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
    - echo "APT репозиторій створено!"
  artifacts:
    paths:
      - public/
    expire_in: 1 month
  only:
    - tags

# ============================================
# ПУБЛІКАЦІЯ НА GITLAB PAGES
# ============================================

pages:
  stage: deploy
  image: ubuntu:22.04
  script:
    - echo "Публікація APT репозиторію на GitLab Pages..."
    - if [ -d "public" ]; then echo "Репозиторій готовий до публікації"; fi
  artifacts:
    paths:
      - public/
    expire_in: 1 year
  only:
    - tags

# ============================================
# РЕЛІЗ НА GITLAB
# ============================================

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Створення релізу..."
  release:
    name: "PDF Tool $CI_COMMIT_TAG"
    description: |
      ## PDF Tool $CI_COMMIT_TAG

      ### 📦 DEB пакети
      - [PDF Tool Full](https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/deb/pdf-tool-full_$CI_COMMIT_TAG-1_all.deb?job=build:deb-full)
      - [PDF Tool Light](https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/deb/pdf-tool-light_$CI_COMMIT_TAG-1_all.deb?job=build:deb-light)

      ### 🪶 AppImage
      - [PDF Tool Full AppImage](https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/appimage/PDFTool-Full-$CI_COMMIT_TAG.AppImage?job=build:appimage-full)
      - [PDF Tool Light AppImage](https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/appimage/PDFTool-Light-$CI_COMMIT_TAG.AppImage?job=build:appimage-light)

      ### 📦 APT репозиторій
      Додайте наш репозиторій:
      ```bash
      echo "deb https://melnikv.gitlab.io/pdf_tool/apt stable main" | sudo tee /etc/apt/sources.list.d/pdf-tool.list
      sudo apt update
      sudo apt install pdf-tool-full
      ```
      
    tag_name: $CI_COMMIT_TAG
    assets:
      links:
        - name: "PDF Tool Full DEB"
          url: "https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/deb/pdf-tool-full_$CI_COMMIT_TAG-1_all.deb?job=build:deb-full"
        - name: "PDF Tool Light DEB"
          url: "https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/deb/pdf-tool-light_$CI_COMMIT_TAG-1_all.deb?job=build:deb-light"
        - name: "PDF Tool Full AppImage"
          url: "https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/appimage/PDFTool-Full-$CI_COMMIT_TAG.AppImage?job=build:appimage-full"
        - name: "PDF Tool Light AppImage"
          url: "https://gitlab.com/MelnikV/pdf_tool/-/jobs/artifacts/$CI_COMMIT_TAG/raw/packages/appimage/PDFTool-Light-$CI_COMMIT_TAG.AppImage?job=build:appimage-light"
  only:
    - tags